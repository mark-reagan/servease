services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8080:8080"
        environment:
            PORT: 8080
            APP_ENV: local
            APP_DEBUG: "true"
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: servease
            DB_USERNAME: servease
            DB_PASSWORD: servease
        depends_on:
            - db
        volumes:
            - ./storage/app:/var/www/html/storage/app

    db:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: servease
            MYSQL_USER: servease
            MYSQL_PASSWORD: servease
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "3306:3306"
        volumes:
            - db-data:/var/lib/mysql

volumes:
    db-data:
